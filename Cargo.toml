[package]
name = "ao3reader"
version = "2.5.3"
license = "GPL-3.0-or-later"
edition = "2024"

[features]
default = ["legacy-ui", "native-ui", "pdf"]
# The native Win32 interface: Direct2D software rendering + DirectWrite, no GPU driver.
native-ui = ["dep:windows", "dep:windows-core", "dep:windows-numerics", "pdf"]
# The original eframe/egui (wgpu DX12) interface. Kept building until the native
# Win32 interface reaches feature parity, then removed together with this feature.
legacy-ui = ["dep:eframe", "dep:egui", "dep:wgpu", "dep:arboard", "dep:webbrowser", "dep:ttf-parser"]
# PDF books, with the engine from the pdfreader project (crates/README.md).
pdf = ["dep:pdf-engine", "dep:pdf-render"]

[[bin]]
name = "ao3reader"
path = "src/main.rs"
required-features = ["legacy-ui"]

[[bin]]
name = "ao3reader-native"
path = "src/bin/ao3reader-native.rs"
required-features = ["native-ui"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
# Already used by ureq for gzip; also unpacks EPUB (ZIP) files.
flate2 = "1"
directories = "6.0.0"
regex = "1.13.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5", features = ["cookies"] }
pdf-engine = { path = "crates/pdf-engine", optional = true }
pdf-render = { path = "crates/pdf-render", optional = true }

# Desktop only: native file dialogs and the mimalloc allocator.
[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
rfd = "0.15"

# legacy-ui only
arboard = { version = "3.6.1", optional = true }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { version = "0.33.3", optional = true }
ttf-parser = { version = "0.25", optional = true }
webbrowser = { version = "1.2.4", optional = true }
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["dx12"] }

[target.'cfg(windows)'.dependencies]
windows-numerics = { version = "0.2", optional = true }
# The COM objects screen readers talk to (`#[implement]` needs the crate by name).
windows-core = { version = "0.61", optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.3"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Speech",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dev-dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]
